
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personaliza tu tarjeta</title>

    <!-- Vincular archivo CSS -->
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <main class="contenedor">

        <h1>Personaliza tu tarjeta</h1>

        <!-- Tarjeta principal -->
        <div id="tarjeta" class="tarjeta">

            <h2>Bienvenido a mi aplicación web</h2>

        </div>

        <!-- Botones para cambiar colores -->
        <div class="botones">

            <button id="azul" class="btn azul">
                Azul
            </button>

            <button id="verde" class="btn verde">
                Verde
            </button>

            <button id="rojo" class="btn rojo">
                Rojo
            </button>

            <button id="restablecer" class="btn restablecer">
                Restablecer
            </button>

        </div>

    </main>

    <!-- Vincular archivo JavaScript -->
    <script src="js/app.js"></script>

</body>
</html>
